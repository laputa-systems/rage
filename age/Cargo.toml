[package]
name = "age"
description = "[BETA] A simple, secure, and modern encryption library."
version = "0.13.0"
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rage", "encryption"]
categories = ["cryptography"]
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[badges]
maintenance = { status = "experimental" }

[dependencies]
age-core.workspace = true

# Dependencies exposed in a public API:
# (Breaking upgrades to these require a breaking upgrade to this crate.)
base64.workspace = true
chacha20poly1305.workspace = true
hmac.workspace = true
rand.workspace = true

# OpenSSH-specific dependencies:
# - RSAES-OAEP from RFC 8017 with SHA-256 and MGF1
rsa = { version = "=0.10.0-rc.22", default-features = false, features = [
    "encoding",
], optional = true }

# - Conversion of public keys from Ed25519 to X25519
curve25519-dalek = { version = "5", optional = true }

# Async I/O
futures = { version = "0.3", optional = true }
pin-project = "1"

# Common CLI dependencies
pinentry = { workspace = true, optional = true }

# Dependencies used internally:
# (Breaking upgrades to these are usually backwards-compatible, but check MSRVs.)
bech32.workspace = true
cipher = { version = "0.5", features = ["alloc"] }
hkdf.workspace = true
hpke = { workspace = true, features = ["mlkem", "nistp"] }
ml-kem.workspace = true
nom.workspace = true
p256.workspace = true
scrypt.workspace = true
sha2.workspace = true
sha3.workspace = true
subtle.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true

# OpenSSH-specific dependencies:
# - RSAES-OAEP from RFC 8017 with SHA-256 and MGF1
num-traits = { version = "0.2", optional = true }

# - Encrypted keys
aes = { version = "0.9", optional = true }
aes-gcm = { version = "0.11", optional = true }
bcrypt-pbkdf = { version = "0.11", optional = true }
cbc = { version = "0.2", optional = true }
ctr = { version = "0.10", optional = true }

# scrypt Performance timer
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Performance",
] }

# Async I/O
memchr = { version = "2.8", optional = true }

# Common CLI dependencies
console = { workspace = true, optional = true, features = ["std"] }
is-terminal = { version = "0.4", optional = true }
rpassword = { version = "7", optional = true }
same-file = { version = "1", optional = true }

# Plugin management
which = { version = "8", optional = true }

[dev-dependencies]
rustybench = "0.4"
flate2.workspace = true
futures-test = "0.3"
hex = "0.4"
proptest = "1"
test-case = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = []
armor = []
async = ["futures", "memchr"]
cli-common = ["console", "is-terminal", "pinentry", "rpassword", "same-file"]
plugin = ["age-core/plugin", "which"]
ssh = [
    "aes",
    "aes-gcm",
    "bcrypt-pbkdf",
    "cbc",
    "ctr",
    "curve25519-dalek",
    "num-traits",
    "rsa",
]
unstable = ["age-core/unstable"]

[lib]
bench = false

[[test]]
name = "test_vectors"
required-features = ["ssh"]

[[test]]
name = "testkit"
required-features = ["armor", "async"]

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "throughput"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
